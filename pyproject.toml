[project]
name = "dungle-scrubs-scraper"
version = "0.2.1"  # x-release-please-version
description = "Get cleaned Markdown for the tools that collect your pages."
license = "MIT"
authors = [{ name = "Kevin Frilot" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Security floor: crawl4ai allows aiohttp<3.14.4, affected by CVE-2026-111064
    # and related advisories. Fixed in 3.14.4 (scraper#38).
    "aiohttp>=3.14.4",
    # Security floor: crawl4ai allows anyio<4.14.2 (PYSEC-2026-4025).
    # Fixed in 4.14.2 (scraper#38).
    "anyio>=4.14.2",
    # Security floor: crawl4ai allows brotli<1.2.1 (PYSEC-2026-4322).
    # Fixed in 1.2.1 (scraper#38).
    "brotli>=1.2.1",
    # Security floor: httpx and requests allow certifi<2026.10.19
    # (PYSEC-2026-4320). Fixed in 2026.10.19 (scraper#38).
    "certifi>=2026.10.19",
    "crawl4ai>=0.9.0",
    "fastapi>=0.136.3",
    # Security floor: huggingface-hub, via tokenizers, allows filelock<4.2.1
    # (CVE-2026-112940). Fixed in 4.2.1 (scraper#38).
    "filelock>=4.2.1",
    "httpx>=0.27.0",
    # Pinned at the runtime layer (not just the uv override) so published-wheel
    # consumers also get the patched lxml line, since crawl4ai pins lxml~=5.3.
    "lxml>=6.1.3",
    # Security floor: aiohttp allows multidict<6.9.1 (PYSEC-2026-4244).
    # Fixed in 6.9.1 (scraper#38).
    "multidict>=6.9.1",
    # Security floor: crawl4ai pulls nltk transitively (>=3.9.1, uncapped) and
    # nltk <=3.9.4 is vulnerable to CVE-2026-12243 / PYSEC-2026-597 (percent-
    # encoded path traversal in nltk.data.load/find). Fixed in 3.10.0.
    "nltk>=3.10.0",
    # Security floor: crawl4ai allows pillow<13.0.0, affected by CVE-2026-112895
    # and related advisories. Fixed in 13.0.0 (scraper#38).
    "pillow>=13.0.0",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Security floor: beautifulsoup4 allows soupsieve<2.9.0 (PYSEC-2026-4170).
    # Fixed in 2.9.0 (scraper#38).
    "soupsieve>=2.9.0",
    # Security floor: fastapi only requires starlette>=0.46, which allows the
    # CVE-2026-54282 (request.url.hostname poisoning) range <1.3.0.
    "starlette>=1.3.0",
    # Security floor: requests allows urllib3<2.8.0 (PYSEC-2026-4177).
    # Fixed in 2.8.0 (scraper#38).
    "urllib3>=2.8.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[project.scripts]
scraper = "scraper.cli:main"

[dependency-groups]
dev = [
    "packaging>=26.2",
    "psutil==7.2.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.uv]
override-dependencies = [
    # crawl4ai 0.8.9 still declares lxml ~=5.3; force the patched line.
    "lxml>=6.1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scraper"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
