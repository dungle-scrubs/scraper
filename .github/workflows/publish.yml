name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, or tag to publish
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: pypi / publish
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers / tag restrictions in
    # the GitHub repo settings for defense-in-depth on PyPI publishing.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned by commit SHA (DF-5). Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Test before publishing
        run: uv run pytest tests/ -q

      - name: Build distributions
        run: uv build

      # PEP 740 provenance attestations; uv publish uploads the matching
      # `.publish.attestation` files. Pin taken from the uv GitHub guide.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027  # v0.0.6

      - name: Publish to PyPI
        run: uv publish
