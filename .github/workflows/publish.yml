name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, or tag to publish
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: pypi / publish
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers / tag restrictions in
    # the GitHub repo settings for defense-in-depth on PyPI publishing.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned by commit SHA (DF-5). Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Test before publishing
        run: uv run pytest tests/ -q

      - name: Build distributions
        run: uv build

      # PEP 740 provenance attestations; uv publish uploads the matching
      # `.publish.attestation` files. Pin taken from the uv GitHub guide.
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a  # v0.0.7

      - name: Publish to PyPI
        run: uv publish
