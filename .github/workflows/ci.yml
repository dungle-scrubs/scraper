name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ci / check
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (DF-5). Bump via Dependabot; tags shown for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Install test Chromium
        run: uv run playwright install --with-deps chromium

      - name: Test
        run: uv run pytest tests/ -v

      - name: Dependency audit (F6)
        # Audit the project's resolved venv, not an ephemeral one. `uvx pip-audit`
        # (the previous form) ran in an isolated env and saw only pip-audit's own
        # deps — the project's crawl4ai/lxml/starlette were never scanned. Running
        # inside the synced venv (via `uv run --with pip-audit`) sees the real
        # resolved dependency graph and fails on known vulnerabilities.
        # `--strict` is dropped: the editable dungle-scrubs-scraper package isn't on
        # PyPI, which --strict makes fatal. pip-audit still fails on actual vulns.
        # PYSEC-2026-3740 (nltk path traversal in model-artifact APIs, GHSA-8mgp-
        # 746c-j5xp) is ignored: no fixed release exists (3.10.3 is last_affected),
        # nltk is a transitive crawl4ai dependency, and this service never passes
        # caller-controlled paths to nltk model-artifact APIs. Revisit on a nltk
        # release newer than 3.10.3.
        run: uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2026-3740
